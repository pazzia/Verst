<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вести в навигаторе · Спринт 4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,a{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #FFD23F;outline-offset:2px}
</style>
</helmet>
<!-- Sprint 4 · 5.13 hand-off chooser (design/screens/5.13-handoff.md §5, ADR-0015 §1). Opened by «Вести в навигаторе» (starts at
     today's day) or a day's «вести». A link carries one day, so the tabs are the days plus «до следующей точки». Tap an app card;
     the chips at the bottom switch what is installed, and «без ключа / ключ получен» shows the state before and after Yandex
     issues our signing key (unsigned: Карты take the whole day, Навигатор only the next point). -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #161618; color: #F4F4F0; font-family: 'IBM Plex Sans Condensed', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <div style="height: 132px; background: linear-gradient(#2B2850 0 38%, #8E4A6B 38% 64%, #D9655A 64% 84%, #F29A5E 84%)"></div>
    <div style="position: absolute; left: 20px; right: 20px; top: 56px; height: 49px; background: #1E4FA3; border-radius: 7px; padding: 3px; box-sizing: border-box">
      <div style="height: 100%; border: 2px solid #F4F4F0; border-radius: 5px; box-sizing: border-box; display: flex; align-items: center; padding: 0 10px; font-weight: 700; font-size: 20px; justify-content: space-between"><span>Золотое кольцо</span><span>825</span></div>
    </div>
    <div style="padding: 18px 20px 0">
      <div style="font-weight: 700; font-size: 28px">Дорога впереди</div>
      <div style="margin-top: 12px; height: 60px; border-radius: 12px; background: #FFD23F"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.6)"></div>

  <div role="dialog" aria-label="Вести в навигаторе" style="position: absolute; left: 0; right: 0; bottom: 0; background: #161618; border-radius: 16px 16px 0 0; border-top: 2px solid #232327; padding: 8px 20px 20px; box-sizing: border-box">
    <div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 2px; background: #3A3A42; margin: 0 auto"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px">
      <h2 style="margin: 0; font-weight: 700; font-size: 22px">Вести в навигаторе</h2>
      <button type="button" aria-label="Закрыть" style="width: 44px; height: 44px; background: none; border: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9B9C0" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div role="tablist" aria-label="Что вести" style="margin-top: 4px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: #0F0F11">
      <sc-for list="{{scopes}}" as="c" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{c.on}}" onClick="{{c.go}}" style="{{c.style}}">{{c.t}}</button></sc-for>
    </div>
    <div style="margin-top: 8px; font-size: 13px; color: #B9B9C0">{{scopeLine}}</div>

    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="2">
        <button type="button" onClick="{{a.go}}" aria-label="{{a.cd}}" style="{{a.style}}">
          <span aria-hidden="true" style="{{a.iconBox}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="{{a.iconFill}}" stroke="none"><path d="{{a.icon}}"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 700; font-size: 17px">{{a.name}}</span><span style="{{a.badgeStyle}}">{{a.badge}}</span></span>
            <span style="font-size: 13px; line-height: 17px; color: {{a.subColor}}">{{a.sub}}</span>
            <span style="{{a.noteStyle}}">{{a.note}}</span>
          </span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9B9C0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M8 16L16 8M9 8h7v7"></path></svg>
        </button>
      </sc-for>
    </div>
    <div style="margin-top: 10px; font-size: 12px; line-height: 16px; color: #8C8C93">{{explain}}</div>
    <div style="margin-top: 8px; min-height: 44px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 14px; font-weight: 600">Запомнить выбор</span>
      <button type="button" onClick="{{toggleRemember}}" aria-pressed="{{remember}}" style="{{switchStyle}}"><span style="{{knobStyle}}"></span></button>
    </div>
    <div style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{demo}}" as="d" hint-placeholder-count="4"><button type="button" onClick="{{d.go}}" style="{{d.style}}">{{d.t}}</button></sc-for>
    </div>
  </div>
  <div role="status" style="{{toastStyle}}">{{toast}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { scope: 'd1', inst: 'both', signed: false, remember: false, toast: '' }; }
  renderVals() {
    const st = this.state, hide = 'display:none', n = '\u00a0';
    const maps = st.inst === 'both' || st.inst === 'maps', navi = st.inst === 'both' || st.inst === 'navi';
    const scopeDefs = [
      { id: 'd1', t: 'День 1', line: 'Москва → Ярославль · 265' + n + 'км · 7 точек', pts: 7 },
      { id: 'd2', t: 'День 2', line: 'Ярославль → Суздаль · 340' + n + 'км · 6 точек', pts: 6 },
      { id: 'd3', t: 'День 3', line: 'Суздаль → Москва · 220' + n + 'км · 4 точки', pts: 4 },
      { id: 'next', t: 'До след.', line: 'Следующая точка: Троице-Сергиева лавра · 73' + n + 'км' }
    ];
    const cur = scopeDefs.find(x => x.id === st.scope);
    const scopes = scopeDefs.map(x => ({ t: x.t, on: x.id === st.scope ? 'true' : 'false', go: () => this.setState({ scope: x.id, toast: '' }),
      style: 'min-height:40px;border:none;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;' + (x.id === st.scope ? 'background:#F4F4F0;color:#141416' : 'background:transparent;color:#B9B9C0') }));
    const multi = st.scope !== 'next';
    const pin = 'M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z';
    const arrow = 'M3 11l18-8-8 18-2-8z';
    const card = (o) => Object.assign({
      style: 'width:100%;min-height:72px;padding:12px;border-radius:12px;display:flex;align-items:center;gap:12px;cursor:pointer;color:#F4F4F0;background:' + (o.primary ? '#1F2A14' : '#1C1C1F') + ';border:' + (o.primary ? '2px solid #FFD23F' : '1px solid #3A3A42') + ';opacity:' + (o.dim ? '.55' : '1'),
      iconBox: 'width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:' + (o.dim ? '#2A2A2E' : '#F4F4F0'),
      iconFill: o.dim ? '#8C8C93' : '#141416',
      badgeStyle: o.badge ? 'height:20px;padding:0 6px;border-radius:4px;background:#FFD23F;color:#141416;font-size:11px;font-weight:700;display:flex;align-items:center' : hide,
      subColor: o.dim ? '#8C8C93' : '#C4C4CA',
      noteStyle: o.note ? 'font-size:12px;color:' + (o.noteWarn ? '#FFD23F' : '#8FA4B8') : hide
    }, o);
    const naviWholeDay = st.signed && navi && multi;
    const mapsCard = card({
      name: 'Яндекс Карты', icon: pin, primary: multi && !naviWholeDay, badge: multi && !naviWholeDay ? 'весь день' : '',
      sub: maps ? (multi ? 'все ' + cur.pts + ' точек дня по порядку; в Картах нажмите «В путь» — поведут с голосом' : 'маршрут до точки, с голосом') : 'не установлены — откроем карту в браузере',
      note: '', cd: 'Яндекс Карты. ' + (maps ? '' : 'Не установлены, откроем в браузере.'),
      go: () => this.setState({ toast: maps ? 'Открываем Яндекс Карты: ' + cur.line : 'Яндекс Карты не установлены — открыли карту в браузере' })
    });
    const naviCard = card({
      name: 'Яндекс Навигатор', icon: arrow, primary: (!multi && navi) || naviWholeDay, dim: !navi, badge: naviWholeDay ? 'весь день' : '',
      sub: !navi ? 'не установлен' : naviWholeDay ? 'все ' + cur.pts + ' точек дня, сразу ведёт с голосом' : 'только до следующей точки: Троице-Сергиева лавра, 73' + n + 'км',
      note: !navi ? 'Установить из магазина приложений' : st.signed ? '' : 'по ссылке открывается до 5 раз в сутки, потом — в браузере',
      noteWarn: !navi,
      cd: 'Яндекс Навигатор. ' + (navi ? (naviWholeDay ? 'Весь день' : 'Только до следующей точки') : 'Не установлен. Установить'),
      go: () => this.setState({ toast: navi ? 'Открываем Яндекс Навигатор: ' + (naviWholeDay ? cur.line : 'до Троице-Сергиевой лавры') : 'Откроем магазин приложений' })
    });
    const apps = naviWholeDay || !multi ? [naviCard, mapsCard] : [mapsCard, naviCard];
    const demoDefs = [['both', 'есть оба'], ['maps', 'только Карты'], ['navi', 'только Навигатор'], ['none', 'ничего']];
    const demo = demoDefs.map(([id, t]) => ({ t: 'пример: ' + t, go: () => this.setState({ inst: id, toast: '' }),
      style: 'height:32px;padding:0 10px;border-radius:16px;font-size:11px;cursor:pointer;background:none;' + (st.inst === id ? 'border:1px solid #8C8C93;color:#F4F4F0' : 'border:1px dashed #3A3A42;color:#8C8C93') }));
    demo.push({ t: st.signed ? 'пример: ключ Яндекса получен' : 'пример: без ключа (сейчас)', go: () => this.setState({ signed: !st.signed, toast: '' }),
      style: 'height:32px;padding:0 10px;border-radius:16px;font-size:11px;cursor:pointer;background:none;border:1px solid #8C8C93;color:#F4F4F0' });
    return {
      scopes, scopeLine: cur.line, apps, demo,
      explain: st.signed ? 'Навигатор получает весь день: старт, финиш и до 8 остановок между ними. Карты — запасной вариант.' : 'Навигатор пока принимает от нас только одну точку, поэтому весь день с остановками ведут Карты — в них тоже есть ведение с голосом.',
      remember: st.remember ? 'true' : 'false', toggleRemember: () => this.setState({ remember: !st.remember }),
      switchStyle: 'width:44px;height:26px;border-radius:13px;border:none;position:relative;cursor:pointer;background:' + (st.remember ? '#FFD23F' : '#3A3A42'),
      knobStyle: 'position:absolute;top:4px;' + (st.remember ? 'right:4px' : 'left:4px') + ';width:18px;height:18px;border-radius:50%;background:' + (st.remember ? '#141416' : '#B9B9C0'),
      toast: st.toast,
      toastStyle: st.toast ? 'position:absolute;left:16px;right:16px;top:16px;min-height:44px;padding:10px 16px;box-sizing:border-box;border-radius:10px;background:#232327;border:1px solid #3A3A42;font-size:13px;display:flex;align-items:center;z-index:2' : hide
    };
  }
}
</script>
</body>
</html>
