<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Предупреждения прогулки · Спринт 4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,a{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #FFD23F;outline-offset:2px}
</style>
</helmet>
<!-- Sprint 4 · walk warnings (design/screens/5.11-walk-result.md §10.4). The crew changes the walk and adds warnings.
     Tap the filter chips (прогулка / дети / собака) to see every combination; the same plates appear under the presets on 5.10. -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #161618; color: #F4F4F0; font-family: 'IBM Plex Sans Condensed', sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 135px; background: #2B2850">
    <div style="position: absolute; left: 0; right: 0; bottom: 3px; height: 60px; background: #3B3046"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #8C8C93"></div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 56px; min-height: 49px; background: #1E4FA3; border-radius: 7px; padding: 3px; box-sizing: border-box">
    <div style="min-height: 43px; border: 2px solid #F4F4F0; border-radius: 5px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 2px 10px">
      <span aria-hidden="true" style="width: 28px; height: 28px; background: #F4F4F0; border-radius: 2px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141416" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="2" fill="#141416"></circle><path d="M9.5 21l2.5-6.5 2.5 2V21M12 14.5l1-5-3.5 1.5L8 14M13 9.5l2.5 3 3 1"></path></svg></span>
      <span style="flex: 1; font-weight: 700; font-size: 20px; line-height: 21px">{{title}}</span>
    </div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 147px">
    <h1 style="margin: 0; font-size: 28px; line-height: 29.4px; font-weight: 700">Прогулка</h1>
    <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><button type="button" onClick="{{f.go}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #55555E; background: #1C1C1F; color: #F4F4F0; font-size: 13px; font-weight: 600; cursor: pointer">{{f.t}} ▾</button></sc-for>
    </div>
    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{plates}}" as="p" hint-placeholder-count="2">
        <div role="note" style="{{p.box}}">
          <span aria-hidden="true" style="{{p.dot}}">{{p.mark}}<svg style="{{p.chk}}" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#141416" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 8px">
            <span>{{p.text}}</span>
            <span style="{{p.act}}"><sc-for list="{{p.btns}}" as="b" hint-placeholder-count="2"><button type="button" onClick="{{b.go}}" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #3A3A42; background: #232327; color: #F4F4F0; font-weight: 600; font-size: 12px; cursor: pointer">{{b.t}}</button></sc-for></span>
          </span>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: 16px; font-size: 12px; line-height: 16px; color: #8C8C93">{{how}}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pi: 0, kids: true, dog: true }; }
  renderVals() {
    const st = this.state, hide = 'display:none';
    const P = [
      { id: 'overview', t: 'Обзорный', title: 'Москва: обзорная прогулка' },
      { id: 'museums', t: 'Музейный', title: 'Москва: музейный маршрут' },
      { id: 'dog_walk', t: 'С собакой', title: 'Москва: прогулка с собакой', nature: true },
      { id: 'beer', t: 'Пивной', title: 'Москва: пивной маршрут', adult: true }
    ];
    const p = P[st.pi];
    const warn = (text, btns) => ({ text, btns: btns || [], act: btns && btns.length ? 'display:flex;flex-wrap:wrap;gap:8px' : hide,
      box: 'padding:10px 12px;border-radius:10px;border:1px solid #FFD23F;font-size:13px;line-height:18.2px;display:flex;gap:10px',
      dot: 'width:18px;height:18px;border-radius:50%;background:#FFD23F;color:#141416;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px', mark: '!', chk: hide });
    const info = (text) => ({ text, btns: [], act: hide,
      box: 'padding:10px 12px;border-radius:10px;background:#1C2A1E;border:1px solid #2F4A33;font-size:13px;line-height:18.2px;display:flex;gap:10px',
      dot: 'width:18px;height:18px;border-radius:50%;background:#7FD38A;color:#141416;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px', mark: '', chk: '' });
    const plates = [];
    if (p.adult) plates.push({ text: 'Пейте умеренно, чередуйте с водой и едой. За руль — только трезвым.', btns: [], act: hide,
      box: 'padding:10px 12px;border-radius:10px;border:1px solid #FFD23F;font-size:13px;line-height:18.2px;display:flex;gap:10px;align-items:center',
      dot: 'width:22px;height:22px;border-radius:50%;background:#F4F4F0;color:#141416;font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0', mark: '18+', chk: hide });
    if (st.kids && p.adult) plates.push(warn('Ребёнку может быть некомфортно: в бары с детьми обычно не пускают.', [{ t: 'Обзорный вместо пивного', go: () => this.setState({ pi: 0 }) }]));
    if (st.kids && !p.adult) plates.push(info(p.id === 'museums' ? 'С ребёнком: взяли интерактивные музеи и паузы каждые 1,5 часа.' : 'С ребёнком: добавили детскую площадку и кафе с детским меню.'));
    if (st.dog && !p.nature) plates.push(warn('С собакой в ' + (p.adult ? 'бары' : p.id === 'museums' ? 'музеи' : 'музеи и кафе') + ' обычно нельзя. Оставьте собаку дома или выберите прогулку с собакой: парки, набережные, виды.', [{ t: 'Прогулка с собакой', go: () => this.setState({ pi: 2 }) }, { t: 'Собака останется дома', go: () => this.setState({ dog: false }) }]));
    if (st.dog && p.nature) plates.push(info('С собакой: парки, набережные, виды и площади — без закрытых помещений.'));
    return {
      title: p.title,
      filters: [
        { t: p.t, go: () => this.setState({ pi: (st.pi + 1) % P.length }) },
        { t: st.kids ? '1 ребёнок' : 'без детей', go: () => this.setState({ kids: !st.kids }) },
        { t: st.dog ? 'с собакой' : 'без собаки', go: () => this.setState({ dog: !st.dog }) }
      ],
      plates,
      how: 'Жёлтые плашки — то, что может помешать; зелёные — как мы подстроили прогулку под экипаж. 18+ больше не запрещён с детьми: спрашиваем только «Вам есть 18?» и предупреждаем.'
    };
  }
}
</script>
</body>
</html>
