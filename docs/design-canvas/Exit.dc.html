<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Съезд к ночёвке</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFD23F}a:hover{color:#FFE27A}
@keyframes rush{from{background-position:0 0}to{background-position:0 160px}}
.lane{background:repeating-linear-gradient(to bottom,#F4F4F0 0 70px,transparent 70px 160px);animation:rush 1.6s linear infinite}
@keyframes near{from{transform:scale(.7) translate(-30px,-20px);opacity:.6}to{transform:none;opacity:1}}
.exit{animation:near 2.2s cubic-bezier(.2,.8,.3,1) both;transform-origin:30% 100%}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
.turn{animation:blink .9s steps(1) infinite}
button:focus-visible,a:focus-visible{outline:2px solid #FFD23F;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #141416; color: #F4F4F0; font-family: 'IBM Plex Sans Condensed', sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 430px; overflow: hidden">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 150px; background: #121130"></div>
    <div style="position: absolute; left: 0; right: 0; top: 150px; height: 60px; background: #2B2850"></div>
    <div style="position: absolute; left: 0; right: 0; top: 210px; height: 30px; background: #4E3768"></div>
    <div class="tw" style="position: absolute; left: 60px; top: 40px; width: 3px; height: 3px; border-radius: 50%; background: #F4F4F0"></div>
    <div class="tw" style="position: absolute; left: 150px; top: 80px; width: 2px; height: 2px; border-radius: 50%; background: #F4F4F0; animation-delay: .8s"></div>
    <div class="tw" style="position: absolute; left: 300px; top: 30px; width: 3px; height: 3px; border-radius: 50%; background: #F4F4F0; animation-delay: 1.6s"></div>
    <div style="position: absolute; left: 70px; top: 46px; width: 40px; height: 40px; border-radius: 50%; background: #F2E3B3; overflow: hidden"><span style="position: absolute; left: 12px; top: -6px; width: 40px; height: 40px; border-radius: 50%; background: #121130; display: block"></span></div>
    <div style="position: absolute; left: 0; right: 0; top: 232px; height: 10px; display: flex; gap: 10px; padding-left: 210px">
      <span style="width: 3px; height: 3px; background: #FFD99A; border-radius: 50%"></span><span style="width: 2px; height: 2px; background: #FFD99A; border-radius: 50%"></span><span style="width: 3px; height: 3px; background: #FFD99A; border-radius: 50%"></span><span style="width: 2px; height: 2px; background: #FFD99A; border-radius: 50%"></span><span style="width: 3px; height: 3px; background: #FFD99A; border-radius: 50%"></span>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 240px; bottom: 0; background: #1A231F"></div>
    <div style="position: absolute; left: 0; right: 0; top: 240px; height: 190px; overflow: hidden; perspective: 200px; perspective-origin: 50% 0%">
      <div style="position: absolute; left: 50%; bottom: 0; width: 230px; height: 900px; margin-left: -115px; background: #2E2E33; border-left: 6px solid #D9D9D2; border-right: 6px solid #D9D9D2; box-sizing: border-box; transform-origin: 50% 100%; transform: rotateX(76deg)">
        <div class="lane" style="position: absolute; top: 0; bottom: 0; left: 50%; width: 8px; margin-left: -4px"></div>
      </div>
    </div>
    <div style="position: absolute; left: 70px; right: 70px; top: 300px; bottom: 0; background: rgba(255,236,170,.10); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%)"></div>
    <div style="position: absolute; right: 70px; top: 196px; width: 6px; height: 100px; background: #55565C"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 16px; background: #0E0E10; border-radius: 0 0 50% 50% / 0 0 14px 14px"></div>
    <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 24px; background: #0E0E10; clip-path: polygon(0 0, 100% 0, 40% 100%, 0 100%)"></div>
    <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 24px; background: #0E0E10; clip-path: polygon(0 0, 100% 0, 100% 100%, 60% 100%)"></div>
  </div>

  <div class="exit" role="img" aria-label="Указатель: съезд на Ярославль, центр, гостиница через 800 метров" style="position: absolute; right: 30px; top: 92px; width: 190px; background: #1E4FA3; border-radius: 8px; padding: 4px; box-shadow: 0 8px 22px rgba(0,0,0,.5)">
    <div style="border: 2px solid #F4F4F0; border-radius: 5px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <span style="font-weight: 700; font-size: 20px; line-height: 1.05">Ярославль<br><span style="font-size: 15px; font-weight: 600">центр</span></span>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F4F4F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 9v8H9"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 34px; height: 34px; background: #F4F4F0; border-radius: 2px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141416" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V8M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"></path><circle cx="7" cy="11" r="2"></circle></svg></span>
        <span style="font-weight: 700; font-size: 18px">800 м</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 410px; bottom: 0; background: #161618; border-radius: 50% 50% 0 0 / 34px 34px 0 0; box-shadow: 0 -2px 0 #232327">
    <a href="Signs.dc.html" style="position: absolute; left: 20px; top: 14px; min-height: 32px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #8C8C93; text-decoration: none">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8C8C93" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M11 5l-7 7 7 7"></path></svg>
      Дорога впереди
    </a>
    <div aria-hidden="true" class="turn" style="position: absolute; right: 24px; top: 20px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #6FD18A">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#6FD18A"><path d="M14 5l7 7-7 7v-4H3V9h11z"></path></svg>поворотник
    </div>

    <div style="position: absolute; left: 14px; right: 14px; top: 54px; bottom: 98px; background: #0B1218; border: 6px solid #232327; border-radius: 16px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #7FA6D9"><span>НОЧЁВКА 1 ИЗ 2</span><span>КМ 265 · 16:30</span></div>
      <div style="font-weight: 700; font-size: 22px; line-height: 1.1">Ярославль</div>
      <div style="font-size: 13px; line-height: 1.4; color: #B9C6D3">Не в Ростове, а на 55 км дальше: тут больше отелей с собакой, а вечером можно дойти до Стрелки. Ваши 300 км в день не превышены.</div>
      <sc-for list="{{hotels}}" as="h" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{h.on}}" onClick="{{h.pick}}" style="{{h.style}}">
          <span aria-hidden="true" style="{{h.radio}}"></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left">
            <span style="font-weight: 700; font-size: 15px">{{h.name}}</span>
            <span style="font-size: 12px; color: #8FA4B8">{{h.tags}}</span>
          </span>
          <span style="font-weight: 700; font-size: 15px; color: #FFD23F; white-space: nowrap">{{h.price}}</span>
        </button>
      </sc-for>
    </div>

    <a href="https://travel.yandex.ru" style="position: absolute; left: 14px; right: 14px; bottom: 24px; height: 60px; border-radius: 12px; background: #FFD23F; color: #141416; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; text-decoration: none">
      <span style="display: flex; flex-direction: column">
        <span style="font-weight: 700; font-size: 18px; line-height: 1.1">Забронировать ночь</span>
        <span style="font-size: 12px; font-weight: 500">через Яндекс Путешествия</span>
      </span>
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141416" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 0 }; }
  renderVals() {
    const list = [
      { name: 'У Стрелки, в центре', tags: 'можно с собакой · семейный номер · парковка', price: '≈ 6 000 ₽' },
      { name: 'У въезда с трассы', tags: 'можно с собакой · охраняемая парковка', price: '≈ 4 500 ₽' }
    ];
    const hotels = list.map((h, i) => {
      const on = this.state.pick === i;
      return Object.assign({}, h, {
        on: on ? 'true' : 'false',
        pick: () => this.setState({ pick: i }),
        radio: 'width:18px;height:18px;border-radius:50%;flex-shrink:0;box-sizing:border-box;border:2px solid ' + (on ? '#FFD23F' : '#3A5266') + ';box-shadow:' + (on ? 'inset 0 0 0 4px #0B1218, inset 0 0 0 9px #FFD23F' : 'none'),
        style: 'width:100%;min-height:60px;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;cursor:pointer;font-family:inherit;color:#F4F4F0;background:' + (on ? '#16222C' : 'transparent') + ';border:1px solid ' + (on ? '#FFD23F' : '#2B3D4D')
      });
    });
    return { hotels };
  }
}
</script>
</body>
</html>
