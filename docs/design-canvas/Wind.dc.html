<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лобовое стекло</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFD23F}a:hover{color:#FFE27A}
@keyframes rush{from{background-position:0 0}to{background-position:0 160px}}
.lane{background:repeating-linear-gradient(to bottom,#F4F4F0 0 70px,transparent 70px 160px);animation:rush .9s linear infinite}
@keyframes post{0%{transform:translate(0,0) scale(.3);opacity:0}10%{opacity:1}100%{transform:translate(150px,260px) scale(2.2);opacity:1}}
.post{animation:post 2.6s cubic-bezier(.55,0,1,.45) infinite}
@keyframes postL{0%{transform:translate(0,0) scale(.3);opacity:0}10%{opacity:1}100%{transform:translate(-150px,260px) scale(2.2);opacity:1}}
.postL{animation:postL 2.6s cubic-bezier(.55,0,1,.45) 1.3s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(216,64,43,.55)}100%{box-shadow:0 0 0 16px rgba(216,64,43,0)}}
.start{animation:ring 1.8s ease-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.mirror{animation:sway 4s ease-in-out infinite;transform-origin:50% 0}
.row{transition:background .2s}
button:focus-visible,a:focus-visible{outline:2px solid #FFD23F;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #141416; color: #F4F4F0; font-family: 'IBM Plex Sans Condensed', sans-serif">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 540px; overflow: hidden">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 110px; background: #2B2850"></div>
    <div style="position: absolute; left: 0; right: 0; top: 110px; height: 70px; background: #4E3768"></div>
    <div style="position: absolute; left: 0; right: 0; top: 180px; height: 55px; background: #8E4A6B"></div>
    <div style="position: absolute; left: 0; right: 0; top: 235px; height: 40px; background: #D9655A"></div>
    <div style="position: absolute; left: 0; right: 0; top: 275px; height: 25px; background: #F29A5E"></div>
    <div style="position: absolute; left: 236px; top: 266px; width: 68px; height: 68px; border-radius: 50%; background: #FFD99A"></div>
    <svg width="390" height="40" viewBox="0 0 390 40" style="position: absolute; left: 0; top: 272px"><path d="M0 28 L40 18 L80 24 L130 12 L170 22 L200 16 L250 26 L300 14 L350 24 L390 18 L390 40 L0 40 Z" fill="#3C3346"></path></svg>
    <div style="position: absolute; left: 0; right: 0; top: 300px; bottom: 0; background: #2C3A33"></div>
    <div style="position: absolute; left: 0; right: 0; top: 300px; height: 240px; overflow: hidden; perspective: 210px; perspective-origin: 50% 0%">
      <div style="position: absolute; left: 50%; bottom: 0; width: 230px; height: 1000px; margin-left: -115px; background: #3A3A3F; border-left: 6px solid #F4F4F0; border-right: 6px solid #F4F4F0; box-sizing: border-box; transform-origin: 50% 100%; transform: rotateX(76deg)">
        <div class="lane" style="position: absolute; top: 0; bottom: 0; left: 50%; width: 8px; margin-left: -4px"></div>
      </div>
    </div>
    <div class="post" style="position: absolute; left: 236px; top: 302px; width: 6px; height: 18px; background: #F4F4F0; border-top: 5px solid #141416; box-sizing: border-box"></div>
    <div class="postL" style="position: absolute; left: 148px; top: 302px; width: 6px; height: 18px; background: #F4F4F0; border-top: 5px solid #141416; box-sizing: border-box"></div>
    <div style="position: absolute; left: 34px; top: 286px; width: 8px; height: 100px; background: #55565C"></div>
    <div style="position: absolute; right: 34px; top: 286px; width: 8px; height: 100px; background: #55565C"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 16px; background: #0E0E10; border-radius: 0 0 50% 50% / 0 0 14px 14px"></div>
    <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 24px; background: #0E0E10; clip-path: polygon(0 0, 100% 0, 40% 100%, 0 100%)"></div>
    <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 24px; background: #0E0E10; clip-path: polygon(0 0, 100% 0, 100% 100%, 60% 100%)"></div>
  </div>

  <a href="Panel.dc.html" class="mirror" aria-label="Экипаж в зеркале: {{crew}}. Изменить" style="position: absolute; left: 120px; top: 8px; width: 150px; display: flex; flex-direction: column; align-items: center; text-decoration: none; z-index: 3">
    <span aria-hidden="true" style="width: 8px; height: 10px; background: #2A2A2E"></span>
    <span aria-hidden="true" style="position: relative; width: 150px; height: 44px; border-radius: 22px; border: 3px solid #2A2A2E; background: #0D0D0F; overflow: hidden; box-sizing: border-box">
      <span style="position: absolute; left: 0; right: 0; top: 0; height: 20px; background: #4E3768"></span>
      <span style="position: absolute; left: 0; right: 0; top: 20px; height: 22px; background: #2C3A33"></span>
      <span style="position: absolute; left: 18px; bottom: 0; width: 26px; height: 26px; display: flex; flex-direction: column; align-items: center"><span style="width: 12px; height: 12px; border-radius: 50%; background: #0D0D0F"></span><span style="width: 24px; height: 12px; border-radius: 10px 10px 0 0; background: #0D0D0F; margin-top: 1px"></span></span>
      <span style="position: absolute; left: 60px; bottom: 0; width: 20px; height: 20px; display: flex; flex-direction: column; align-items: center"><span style="width: 9px; height: 9px; border-radius: 50%; background: #0D0D0F"></span><span style="width: 18px; height: 10px; border-radius: 8px 8px 0 0; background: #0D0D0F; margin-top: 1px"></span></span>
      <span style="position: absolute; left: 94px; bottom: 0; width: 26px; height: 26px; display: flex; flex-direction: column; align-items: center"><span style="width: 12px; height: 12px; border-radius: 50%; background: #0D0D0F"></span><span style="width: 24px; height: 12px; border-radius: 10px 10px 0 0; background: #0D0D0F; margin-top: 1px"></span></span>
      <span style="position: absolute; right: 8px; bottom: 6px; width: 14px; height: 12px; border-radius: 6px 6px 4px 4px; background: #0D0D0F"></span>
      <span style="position: absolute; right: 9px; bottom: 15px; width: 4px; height: 6px; border-radius: 2px; background: #0D0D0F; transform: rotate(-20deg)"></span>
      <span style="position: absolute; right: 17px; bottom: 15px; width: 4px; height: 6px; border-radius: 2px; background: #0D0D0F; transform: rotate(20deg)"></span>
      <span style="position: absolute; left: -20px; top: -10px; width: 60px; height: 70px; background: rgba(255,255,255,.08); transform: rotate(25deg)"></span>
    </span>
    <span style="margin-top: 3px; font-size: 11px; font-weight: 600; color: #E9E2F2; text-shadow: 0 1px 2px #000">{{crew}}</span>
  </a>

  <div style="position: absolute; left: 20px; right: 20px; top: 84px; background: #1E4FA3; border-radius: 9px; padding: 4px; box-shadow: 0 8px 18px rgba(0,0,0,.35); z-index: 2">
    <div style="border: 2px solid #F4F4F0; border-radius: 6px; padding: 6px 6px 4px">
      <div style="display: flex; justify-content: space-between; padding: 0 6px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #D6E0F5">
        <span>РЯДОМ С ВАМИ · ИЗ МОСКВЫ</span><span>КМ</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <button type="button" class="row" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="{{r.style}}">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{r.arrowColor}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.arrow}}"></path></svg>
          <span style="flex: 1; min-width: 0; text-align: left; font-weight: 600; font-size: 18px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
          <span style="font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums">{{r.km}}</span>
        </button>
      </sc-for>
      <div style="padding: 3px 6px 1px; font-size: 11px; color: #D6E0F5">ещё 14 маршрутов в радиусе 300 км ↓</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 520px; bottom: 0; background: #161618; border-radius: 50% 50% 0 0 / 34px 34px 0 0; box-shadow: 0 -2px 0 #232327">
    <a href="Navi.dc.html" style="position: absolute; left: 18px; right: 18px; top: 22px; height: 134px; background: #0B1218; border: 6px solid #232327; border-radius: 16px; box-sizing: border-box; padding: 10px 12px; text-decoration: none; color: #F4F4F0; display: flex; flex-direction: column; gap: 8px">
      <span style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #7FA6D9">
        <span>НАВИГАТОР</span>
        <span style="display: flex; align-items: center; gap: 4px"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="#7FA6D9"><path d="M3 11l18-8-8 18-2-8z"></path></svg>ВЫ: МОСКВА</span>
      </span>
      <span style="height: 46px; border-radius: 10px; background: #16222C; border: 1px solid #2B3D4D; display: flex; align-items: center; gap: 10px; padding: 0 12px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="display: flex; flex-direction: column">
          <span style="font-weight: 600; font-size: 16px">Куда угодно</span>
          <span style="font-size: 12px; color: #8FA4B8">город, адрес или точка на карте — по всей России</span>
        </span>
      </span>
      <span style="font-size: 12px; color: #8FA4B8">или выберите готовый маршрут на указателе ↑</span>
    </a>

    <div style="position: absolute; left: 22px; right: 20px; top: 176px; display: flex; align-items: center; gap: 14px">
      <div style="flex: 1; min-width: 0" aria-live="polite">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8C8C93">ВЫБРАН МАРШРУТ</div>
        <div style="font-weight: 700; font-size: 22px; line-height: 1.1">{{sel.name}}</div>
        <div style="margin-top: 2px; font-size: 13px; color: #B9B9C0">{{sel.meta}}</div>
      </div>
      <a href="Panel.dc.html" class="start" aria-label="Поехали: {{sel.name}}" style="width: 92px; height: 92px; border-radius: 50%; background: #232327; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
        <span style="width: 76px; height: 76px; border-radius: 50%; border: 3px solid #D8402B; background: #1C1C1F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-sizing: border-box">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F4F0" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8M6.3 6.6a8 8 0 1 0 11.4 0"></path></svg>
          <span style="font-weight: 700; font-size: 12px; letter-spacing: 0.06em; color: #F4F4F0">ПОЕХАЛИ</span>
        </span>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 0 }; }
  renderVals() {
    const UR = 'M7 17L17 7M9 7h8v8', UP = 'M12 20V4M5 11l7-7 7 7', DN = 'M12 4v16M5 13l7 7 7-7', DL = 'M17 7L7 17M15 17H7V9';
    const list = [
      { name: 'Золотое кольцо', km: '745', arrow: UR, meta: '3 дня · 8 городов · по кругу' },
      { name: 'Ярославль', km: '265', arrow: UP, meta: '2 дня · Ростов и Переславль по пути' },
      { name: 'Суздаль · Владимир', km: '220', arrow: UR, meta: '2 дня · кремли и Золотые ворота' },
      { name: 'Тула · Ясная Поляна', km: '200', arrow: DN, meta: '1–2 дня · кремль и усадьба Толстого' }
    ];
    const s = this.state.sel;
    const rows = list.map((r, i) => {
      const on = i === s;
      return {
        name: r.name, km: r.km, arrow: r.arrow, on: on ? 'true' : 'false',
        arrowColor: on ? '#FFD23F' : '#F4F4F0',
        pick: () => this.setState({ sel: i }),
        style: 'width:100%;min-height:42px;display:flex;align-items:center;gap:10px;padding:0 6px;border:none;border-radius:4px;cursor:pointer;font-family:inherit;color:' + (on ? '#FFD23F' : '#F4F4F0') + ';background:' + (on ? 'rgba(255,255,255,.14)' : 'transparent')
      };
    });
    return { rows, sel: list[s], crew: '2 взр · 1 реб · пёс' };
  }
}
</script>
</body>
</html>
