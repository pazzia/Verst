<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Верста — Все 13 экранов (Camping & Camper UI)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Comfortaa:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-paper: #F5EFEB;
            --card-paper: #FAF4EE;
            --border-brown: #4A3525;
            --text-dark: #322317;
            --accent-orange: #E87A3D;
            --accent-amber: #F4A261;
            --accent-green: #588157;
            --accent-blue: #1E4FA3;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1A130D;
            color: var(--text-dark);
        }

        .font-caveat { font-family: 'Caveat', cursive; }
        .font-comfortaa { font-family: 'Comfortaa', cursive; }

        .craft-card {
            background-color: var(--card-paper);
            border: 2.5px solid var(--border-brown);
            border-radius: 20px;
            box-shadow: 3px 4px 0px rgba(74, 53, 37, 0.25);
        }

        .craft-btn {
            background-color: var(--accent-orange);
            color: #FFFFFF;
            border: 2.5px solid var(--border-brown);
            border-radius: 16px;
            box-shadow: 3px 4px 0px var(--border-brown);
            font-weight: 700;
            transition: all 0.15s ease;
        }
        .craft-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 2px 0px var(--border-brown);
        }

        .craft-badge {
            background-color: var(--accent-amber);
            border: 1.5px solid var(--border-brown);
            color: var(--border-brown);
            font-weight: 800;
            border-radius: 10px;
        }

        .stamp-box {
            border: 2px dashed #B23A22;
            color: #B23A22;
            transform: rotate(-4deg);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .road-line {
            background-image: linear-gradient(to bottom, var(--border-brown) 50%, rgba(255, 255, 255, 0) 0%);
            background-position: left;
            background-size: 3px 12px;
            background-repeat: repeat-y;
        }

        @keyframes pulse-light {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow { animation: pulse-light 2s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-6">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ ПЕРЕКЛЮЧЕНИЯ ЭКРАНОВ -->
    <div class="w-full max-w-[420px] mb-3 bg-[#261C14] border-2 border-[#4A3525] rounded-2xl p-2.5 text-white flex flex-col gap-2">
        <div class="flex justify-between items-center px-1">
            <span class="text-xs font-bold text-[#F4A261] font-comfortaa"><i class="fa-solid fa-van-shuttle mr-1"></i> Переключатель экранов (13):</span>
            <span id="screen-counter" class="text-[10px] bg-[#E87A3D] px-2 py-0.5 rounded-full font-bold">1 / 13</span>
        </div>
        <select id="screen-selector" onchange="switchScreen(this.value)" class="w-full bg-[#322317] border border-[#4A3525] rounded-xl py-1.5 px-3 text-xs font-bold text-[#FAF4EE] focus:outline-none">
            <option value="windshield">1. Лобовое (Главный экран)</option>
            <option value="navigator">2. Навигатор (Куда едем)</option>
            <option value="instruments">3. Приборы (Настройки поездки)</option>
            <option value="drive">4. Строим дорогу (Загрузка)</option>
            <option value="nofit">5. Не помещается в бюджет</option>
            <option value="road">6. Дорога впереди (План дня)</option>
            <option value="border">7. Шторка «Граница»</option>
            <option value="waybill">8. Путевой лист (Бюджет)</option>
            <option value="exit">9. Съезд к ночёвке (Отель)</option>
            <option value="city">10. По городу пешком (Настройки)</option>
            <option value="walk">11. Прогулка (Маршрут пешком)</option>
            <option value="card">12. Карточка места</option>
            <option value="settings">13. Настройки приложения</option>
        </select>
    </div>

    <!-- КОРПУС СМАРТФОНА -->
    <div class="relative w-full max-w-[400px] h-[830px] bg-[#1A130D] rounded-[48px] p-3.5 border-4 border-[#3D2C1E] shadow-2xl flex flex-col justify-between overflow-hidden">
        
        <!-- Dynamic Island -->
        <div class="absolute top-5 left-1/2 -translate-x-1/2 w-28 h-5 bg-black rounded-full z-50 flex items-center justify-between px-3">
            <div class="w-2 h-2 bg-[#261C14] rounded-full border border-stone-800"></div>
            <div class="w-2 h-2 bg-orange-950/80 rounded-full"></div>
        </div>

        <!-- Экран устройства -->
        <div class="w-full h-full bg-[#F5EFEB] rounded-[36px] overflow-hidden relative flex flex-col border-2 border-[#4A3525]">
            
            <!-- Статус-бар -->
            <div class="pt-2.5 px-6 pb-1.5 flex justify-between items-center text-[11px] font-bold text-[#4A3525] z-40 select-none opacity-90">
                <span>09:41</span>
                <div class="flex items-center gap-1.5 text-xs">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-full"></i>
                </div>
            </div>

            <!-- Шапка с логотипом -->
            <div class="px-4 py-2 bg-[#EFE6DC] border-b-2 border-[#4A3525] flex justify-between items-center z-30 shrink-0">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-[#F4A261] border-2 border-[#4A3525] rounded-xl flex items-center justify-center shadow-[2px_2px_0px_#4A3525]">
                        <i class="fa-solid fa-van-shuttle text-[#4A3525] text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-sm font-black tracking-wide text-[#322317] leading-none font-comfortaa">ВЕРСТА</h1>
                        <span class="text-[9px] font-bold text-[#E87A3D] uppercase tracking-wider">Кемпер-гид</span>
                    </div>
                </div>
                <button onclick="switchScreen('settings')" class="w-7 h-7 rounded-lg bg-[#FAF4EE] border-2 border-[#4A3525] flex items-center justify-center text-[#4A3525] text-xs font-bold shadow-[2px_2px_0px_#4A3525]">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>

            <!-- ДИНАМИЧЕСКИЙ КОНТЕНТ (СЮДА РЕНДЕРИТСЯ ЭКРАН) -->
            <div id="screen-container" class="flex-1 overflow-y-auto no-scrollbar relative p-3.5 space-y-3">
            </div>

            <!-- ТАББАР (НИЖНЯЯ НАВИГАЦИЯ) -->
            <div class="bg-[#EFE6DC] border-t-2 border-[#4A3525] px-3 py-1.5 flex justify-around items-center z-40 shrink-0">
                <button onclick="switchScreen('windshield')" id="tab-windshield" class="flex flex-col items-center gap-0.5 text-[#E87A3D]">
                    <div class="w-7 h-7 rounded-lg bg-[#E87A3D] text-white border-2 border-[#4A3525] flex items-center justify-center text-xs shadow-[2px_2px_0px_#4A3525]">
                        <i class="fa-solid fa-compass"></i>
                    </div>
                    <span class="text-[8px] font-bold">Старт</span>
                </button>

                <button onclick="switchScreen('instruments')" id="tab-instruments" class="flex flex-col items-center gap-0.5 text-[#4A3525]/60">
                    <div class="w-7 h-7 rounded-lg bg-[#FAF4EE] text-[#4A3525] border-2 border-[#4A3525] flex items-center justify-center text-xs shadow-[2px_2px_0px_#4A3525]">
                        <i class="fa-solid fa-sliders"></i>
                    </div>
                    <span class="text-[8px] font-bold">Приборы</span>
                </button>

                <button onclick="switchScreen('road')" id="tab-road" class="flex flex-col items-center gap-0.5 text-[#4A3525]/60">
                    <div class="w-7 h-7 rounded-lg bg-[#FAF4EE] text-[#4A3525] border-2 border-[#4A3525] flex items-center justify-center text-xs shadow-[2px_2px_0px_#4A3525]">
                        <i class="fa-solid fa-route"></i>
                    </div>
                    <span class="text-[8px] font-bold">Дорога</span>
                </button>

                <button onclick="switchScreen('city')" id="tab-city" class="flex flex-col items-center gap-0.5 text-[#4A3525]/60">
                    <div class="w-7 h-7 rounded-lg bg-[#FAF4EE] text-[#4A3525] border-2 border-[#4A3525] flex items-center justify-center text-xs shadow-[2px_2px_0px_#4A3525]">
                        <i class="fa-solid fa-person-walking"></i>
                    </div>
                    <span class="text-[8px] font-bold">Пешком</span>
                </button>

                <button onclick="switchScreen('waybill')" id="tab-waybill" class="flex flex-col items-center gap-0.5 text-[#4A3525]/60">
                    <div class="w-7 h-7 rounded-lg bg-[#FAF4EE] text-[#4A3525] border-2 border-[#4A3525] flex items-center justify-center text-xs shadow-[2px_2px_0px_#4A3525]">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <span class="text-[8px] font-bold">Путевой</span>
                </button>
            </div>

            <!-- Home Bar -->
            <div class="py-1 bg-[#EFE6DC] flex justify-center z-40">
                <div class="w-24 h-1 bg-[#4A3525] rounded-full opacity-40"></div>
            </div>

        </div>
    </div>

    <!-- JS СКРИПТ ВСЕХ 13 ЭКРАНОВ -->
    <script>
        const SCREENS = {
            // 1. Лобовое (Главный)
            windshield: () => `
                <div class="craft-card p-3 space-y-2.5">
                    <div class="flex justify-between items-center border-b-2 border-dashed border-[#4A3525]/20 pb-1.5">
                        <div class="flex items-center gap-1.5">
                            <i class="fa-solid fa-van-shuttle text-[#E87A3D]"></i>
                            <span class="text-xs font-black text-[#322317]">Мой Кемпер / Экипаж</span>
                        </div>
                        <span class="craft-badge px-2 py-0.5 text-[9px]">4 гостя</span>
                    </div>
                    <div class="bg-[#EFE6DC] rounded-xl border-2 border-[#4A3525] p-2 flex justify-around text-center">
                        <div><div class="w-7 h-7 rounded-full bg-[#F4A261] border border-[#4A3525] flex items-center justify-center mx-auto text-xs">👨‍✈️</div><span class="text-[8px] font-bold mt-0.5 block">Водитель</span></div>
                        <div><div class="w-7 h-7 rounded-full bg-[#F4A261] border border-[#4A3525] flex items-center justify-center mx-auto text-xs">👩</div><span class="text-[8px] font-bold mt-0.5 block">Штурман</span></div>
                        <div><div class="w-7 h-7 rounded-full bg-[#E87A3D] text-white border border-[#4A3525] flex items-center justify-center mx-auto text-xs">👦</div><span class="text-[8px] font-bold mt-0.5 block">Ребёнок</span></div>
                        <div><div class="w-7 h-7 rounded-full bg-[#588157] text-white border border-[#4A3525] flex items-center justify-center mx-auto text-xs">🐕</div><span class="text-[8px] font-bold mt-0.5 block">Пёс Барни</span></div>
                    </div>
                </div>

                <div onclick="switchScreen('navigator')" class="craft-card p-3 space-y-2 cursor-pointer hover:bg-[#FAF4EE]/90">
                    <label class="text-[10px] font-extrabold text-[#322317] uppercase tracking-wider block">Куда едем?</label>
                    <div class="relative">
                        <input type="text" readonly value="Суздаль — Золотое Кольцо" class="w-full bg-[#FAF4EE] border-2 border-[#4A3525] rounded-xl py-2 pl-8 pr-3 text-xs font-bold text-[#322317] cursor-pointer">
                        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-xs text-[#E87A3D]"></i>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="text-xs font-extrabold text-[#322317] uppercase tracking-wider">Готовые автомаршруты</h3>
                        <span class="text-[9px] font-bold text-[#E87A3D]">Все (12)</span>
                    </div>

                    <div onclick="switchScreen('road')" class="craft-card p-2.5 flex gap-2.5 items-center cursor-pointer">
                        <div class="w-12 h-12 rounded-xl border-2 border-[#4A3525] overflow-hidden shrink-0">
                            <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=200&q=80" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between">
                                <h4 class="text-xs font-black text-[#322317] truncate">Золотое Кольцо РФ</h4>
                                <span class="craft-badge px-1.5 py-0.2 text-[8px]">2 дня</span>
                            </div>
                            <p class="text-[9px] text-[#4A3525]/70 truncate">Москва → Владимир → Суздаль</p>
                            <span class="text-[9px] font-bold text-[#588157] mt-0.5 block"><i class="fa-solid fa-road mr-1"></i> 450 км</span>
                        </div>
                    </div>
                </div>

                <button onclick="switchScreen('drive')" class="w-full craft-btn py-3 text-xs uppercase flex items-center justify-center gap-2">
                    <i class="fa-solid fa-compass"></i> ПОЕХАЛИ В ПУТЕШЕСТВИЕ
                </button>
            `,

            // 2. Навигатор (Куда)
            navigator: () => `
                <div class="craft-card p-3 space-y-3">
                    <h3 class="text-xs font-black text-[#322317] border-b border-[#4A3525]/20 pb-1">Поиск направления</h3>
                    <div class="space-y-2">
                        <div>
                            <span class="text-[9px] font-bold uppercase text-[#4A3525]">Откуда:</span>
                            <input type="text" value="Моё местоположение (Москва)" class="w-full bg-[#EFE6DC] border-2 border-[#4A3525] rounded-xl py-1.5 px-3 text-xs font-bold">
                        </div>
                        <div>
                            <span class="text-[9px] font-bold uppercase text-[#4A3525]">Куда:</span>
                            <input type="text" placeholder="Введите город или точку..." value="Минск (Беларусь)" class="w-full bg-white border-2 border-[#4A3525] rounded-xl py-1.5 px-3 text-xs font-bold text-[#E87A3D]">
                        </div>
                    </div>
                </div>

                <div onclick="switchScreen('border')" class="craft-card p-3 bg-amber-50 space-y-1.5 cursor-pointer border-dashed">
                    <div class="flex justify-between items-center">
                        <span class="craft-badge px-2 py-0.5 text-[9px] bg-[#1E4FA3] text-white">Заграница</span>
                        <i class="fa-solid fa-chevron-right text-xs text-[#4A3525]"></i>
                    </div>
                    <h4 class="text-xs font-bold text-[#322317]">Поездку за границу строит сервер</h4>
                    <p class="text-[9px] text-[#4A3525]/80">Нужен интернет. Нажмите, чтобы посмотреть памятку документов и сборов.</p>
                </div>

                <button onclick="switchScreen('instruments')" class="w-full craft-btn py-2.5 text-xs uppercase">Продолжить выбор</button>
            `,

            // 3. Приборы (Настройки поездки)
            instruments: () => `
                <div class="craft-card p-3 space-y-3">
                    <h3 class="text-xs font-black text-[#322317] border-b border-[#4A3525]/20 pb-1">Приборная панель</h3>
                    
                    <div>
                        <span class="text-[10px] font-bold text-[#4A3525] uppercase">Пробег в день (км):</span>
                        <div class="flex items-center gap-2 mt-1">
                            <button class="w-8 h-8 rounded-xl bg-[#EFE6DC] border-2 border-[#4A3525] font-bold text-xs">-</button>
                            <input type="text" value="350 км/день" readonly class="flex-1 text-center bg-white border-2 border-[#4A3525] rounded-xl py-1.5 text-xs font-black font-mono">
                            <button class="w-8 h-8 rounded-xl bg-[#EFE6DC] border-2 border-[#4A3525] font-bold text-xs">+</button>
                        </div>
                    </div>

                    <div>
                        <span class="text-[10px] font-bold text-[#4A3525] uppercase">Бюджет поездки:</span>
                        <input type="text" value="25 000 ₽" class="w-full bg-white border-2 border-[#4A3525] rounded-xl py-1.5 px-3 text-xs font-black font-mono mt-1">
                    </div>

                    <div>
                        <span class="text-[10px] font-bold text-[#4A3525] uppercase block mb-1">Настроение «Как едем»:</span>
                        <div class="grid grid-cols-3 gap-1.5">
                            <button class="p-2 rounded-xl border-2 border-[#4A3525] bg-[#E87A3D] text-white text-[9px] font-bold text-center">Спокойно</button>
                            <button class="p-2 rounded-xl border-2 border-[#4A3525] bg-white text-[#4A3525] text-[9px] font-bold text-center">Весело</button>
                            <button class="p-2 rounded-xl border-2 border-[#4A3525] bg-white text-[#4A3525] text-[9px] font-bold text-center">Только путь</button>
                        </div>
                    </div>
                </div>

                <button onclick="switchScreen('drive')" class="w-full craft-btn py-3 text-xs uppercase">Рассчитать маршрут</button>
            `,

            // 4. Строим дорогу
            drive: () => `
                <div class="craft-card p-5 space-y-4 text-center my-8">
                    <div class="w-16 h-16 bg-[#F4A261] border-2 border-[#4A3525] rounded-full flex items-center justify-center mx-auto text-2xl animate-bounce shadow-[3px_3px_0px_#4A3525]">
                        <i class="fa-solid fa-van-shuttle text-[#4A3525]"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-[#322317] font-comfortaa">Строим дорогу...</h3>
                        <p class="text-[10px] text-[#4A3525]/70 mt-1">Ищем лучшие ночёвки, АЗС и живописные места</p>
                    </div>
                    <div class="w-full bg-[#EFE6DC] border-2 border-[#4A3525] h-3 rounded-full overflow-hidden p-0.5">
                        <div class="bg-[#E87A3D] h-full rounded-full w-3/4 transition-all duration-500"></div>
                    </div>
                    <span class="text-[9px] font-bold text-[#E87A3D] uppercase tracking-wider block animate-pulse-slow">Стадия: Подбор кемпингов</span>
                </div>
                <button onclick="switchScreen('road')" class="w-full craft-btn py-2.5 text-xs uppercase">Готово (Показать)</button>
            `,

            // 5. Не помещается в бюджет
            nofit: () => `
                <div class="craft-card p-4 space-y-3 bg-red-50 text-center">
                    <div class="w-12 h-12 bg-[#B23A22] text-white border-2 border-[#4A3525] rounded-full flex items-center justify-center mx-auto text-lg font-black shadow-[2px_2px_0px_#4A3525]">
                        35k
                    </div>
                    <div>
                        <h3 class="text-xs font-black text-[#322317]">Не помещается в бюджет!</h3>
                        <p class="text-[9px] text-[#4A3525]/80 mt-0.5">Расчётная стоимость 35 000 ₽ превышает лимит в 25 000 ₽</p>
                    </div>
                    <div class="space-y-1.5 text-left pt-2 border-t border-[#4A3525]/20">
                        <button onclick="switchScreen('road')" class="w-full p-2 bg-white border-2 border-[#4A3525] rounded-xl text-[10px] font-bold text-[#322317] flex justify-between">
                            <span>1. Выбрать эконом-кемпинг</span>
                            <span class="text-[#588157]">-4 000 ₽</span>
                        </button>
                        <button onclick="switchScreen('road')" class="w-full p-2 bg-white border-2 border-[#4A3525] rounded-xl text-[10px] font-bold text-[#322317] flex justify-between">
                            <span>2. Исключить платные трассы</span>
                            <span class="text-[#588157]">-2 500 ₽</span>
                        </button>
                    </div>
                </div>
                <button onclick="switchScreen('waybill')" class="w-full craft-btn py-2.5 text-xs uppercase">Посмотреть путевой лист</button>
            `,

            // 6. Дорога впереди (Главный план)
            road: () => `
                <div class="craft-card p-2.5 flex justify-between items-center">
                    <div>
                        <span class="text-[8px] font-bold text-[#E87A3D] uppercase">День 1 из 2</span>
                        <h3 class="text-xs font-black text-[#322317]">Москва → Суздаль</h3>
                    </div>
                    <span class="craft-badge px-2 py-0.5 text-[9px]">220 км</span>
                </div>

                <div class="craft-card p-3 relative overflow-hidden space-y-4">
                    <div class="absolute left-6 top-4 bottom-4 w-1 road-line z-0"></div>

                    <!-- Остановка 1 -->
                    <div onclick="switchScreen('card')" class="flex gap-2.5 items-start cursor-pointer relative z-10">
                        <div class="w-8 h-8 rounded-xl border-2 border-[#4A3525] bg-[#E87A3D] text-white flex items-center justify-center text-xs shrink-0 shadow-[2px_2px_0px_#4A3525]">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                        <div class="flex-1 bg-[#FAF4EE] border-2 border-[#4A3525] rounded-xl p-2">
                            <div class="flex justify-between text-[8px] font-bold text-[#E87A3D]"><span>МУЗЕЙ</span><span>11:30</span></div>
                            <h4 class="text-xs font-extrabold text-[#322317]">Владимирский Кремль</h4>
                        </div>
                    </div>

                    <!-- Остановка 2 -->
                    <div onclick="switchScreen('exit')" class="flex gap-2.5 items-start cursor-pointer relative z-10">

        const screenKeys = Object.keys(SCREENS);

        function switchScreen(screenKey) {
            if (!SCREENS[screenKey]) return;
            
            // Рендер контента
            document.getElementById('screen-container').innerHTML = SCREENS[screenKey]();
            
            // Обновление селектора и счетчика
            const index = screenKeys.indexOf(screenKey) + 1;
            document.getElementById('screen-selector').value = screenKey;
            document.getElementById('screen-counter').innerText = `${index} / 13`;

            // Сброс активной вкладки таббара
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                const iconDiv = btn.querySelector('div');
                if (iconDiv) {
                    iconDiv.className = "w-7 h-7 rounded-lg bg-[#FAF4EE] text-[#4A3525] border-2 border-[#4A3525] flex items-center justify-center text-xs shadow-[2px_2px_0px_#4A3525]";
                }
            });

            // Подсветить нужную вкладку
            const activeTab = document.getElementById(`tab-${screenKey}`);
            if (activeTab) {
                const iconDiv = activeTab.querySelector('div');
                if (iconDiv) {
                    iconDiv.className = "w-7 h-7 rounded-lg bg-[#E87A3D] text-white border-2 border-[#4A3525] flex items-center justify-center text-xs shadow-[2px_2px_0px_#4A3525]";
                }
            }
        }

        // Старт с главного экрана
        window.onload = () => switchScreen('windshield');
