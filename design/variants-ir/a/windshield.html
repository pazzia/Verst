<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Чистое лобовое · Главный</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Windshield, variants A and B (B = this file with data-theme="day", see tools/build-b.js). */
.scene { position: relative; flex-shrink: 0; padding: 8px 20px 0; }
.scene-bg { position: absolute; inset: 0 0 -28px 0; z-index: 0; overflow: hidden; }
.scene > *:not(.scene-bg) { position: relative; z-index: 1; }
.mirror { display: flex; flex-direction: column; align-items: center; margin: 0 auto; width: 260px; min-height: 48px; }
.mirror .stem { width: 8px; height: 8px; background: var(--mirror-bezel); }
.mirror .body { position: relative; width: 150px; height: 44px; border-radius: 22px; border: 3px solid var(--mirror-bezel); background: var(--mirror-glass); overflow: hidden; }
.mirror .body i { position: absolute; display: block; }
.mirror .cap { margin-top: 4px; font-weight: 600; font-size: 14px; line-height: 18px; color: var(--mirror-label); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
[data-theme="day"] .mirror .cap { text-shadow: none; }
.scene .sign { margin-top: 10px; }
.road-strip { height: var(--road-strip, 72px); }
.dash { position: relative; z-index: 2; flex: 1; min-height: 0; margin-top: -24px; background: var(--bg); border-radius: 50% 50% 0 0 / 28px 28px 0 0; box-shadow: 0 -2px 0 var(--rim);
  display: flex; flex-direction: column; padding: 30px 18px 14px; }
.navi { background: var(--navi-screen); border: 6px solid var(--rim); border-radius: 16px; padding: 4px 12px 12px; }
.navi .hd { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.navi .hd span { font-weight: 600; font-size: 15px; color: var(--navi-label); }
.navi .hd button { display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 2px 0 10px; font-weight: 600; font-size: 15px; color: var(--navi-label); }
.dash .navi { margin-top: auto; }
.dash .bottom { margin-top: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 0 2px; }
.firstrun { margin: 0 2px 18px; }
.fr-t { margin: 0 0 10px; font-weight: 600; font-size: 15px; line-height: 20px; color: var(--text-2); }
.fr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fr > span { display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 18px; color: var(--text-2); }
.svc { display: flex; justify-content: center; width: 40px; height: 50px; padding-top: 4px; border-radius: 4px; background: var(--sign); flex-shrink: 0; box-shadow: inset 0 0 0 1.5px var(--sign-white); }
.svc > i { width: 32px; height: 32px; border-radius: 2px; background: var(--sign-white); display: flex; align-items: center; justify-content: center; }
.svc b { font-size: 22px; line-height: 1; font-weight: 700; color: #141416; }
@media (max-height: 760px) {
  /* short windows: no first-run legend; spare height goes to the road strip, not to an empty dashboard */
  .firstrun { display: none; }
  .scene { flex: 1 0 auto; display: flex; flex-direction: column; }
  .road-strip { flex: 1 0 var(--road-strip); }
  .dash { flex: 0 0 auto; }
  .dash .navi { margin-top: 0; }
}
@media (max-height: 700px) {
  .scene { --road-strip: 26px; padding-top: 4px; }
  .scene .sign { margin-top: 6px; }
  .srow { min-height: 60px; padding: 6px 8px; }
  .dash { padding-top: 26px; }
  .navi .hd { min-height: 40px; }
  .field { min-height: 60px; }
  .dash .bottom { margin-top: 10px; gap: 4px; }
}
</style>
</head>
<body>
<div class="phone">
  <div class="scene">
    <div class="scene-bg"></div>

    <button class="mirror" aria-label="Экипаж: 2 взрослых, 1 ребёнок, собака. Изменить">
      <span class="stem" aria-hidden="true"></span>
      <span class="body" aria-hidden="true">
        <i style="left:0;right:0;top:0;height:20px;background:var(--mirror-sky)"></i>
        <i style="left:0;right:0;top:20px;height:22px;background:var(--mirror-ground)"></i>
        <i style="left:18px;bottom:0;width:24px;height:25px"><i style="left:6px;top:0;width:12px;height:12px;border-radius:50%;background:var(--mirror-glass)"></i><i style="left:0;top:13px;width:24px;height:12px;border-radius:10px 10px 0 0;background:var(--mirror-glass)"></i></i>
        <i style="left:60px;bottom:0;width:18px;height:20px"><i style="left:4.5px;top:0;width:9px;height:9px;border-radius:50%;background:var(--mirror-glass)"></i><i style="left:0;top:10px;width:18px;height:10px;border-radius:8px 8px 0 0;background:var(--mirror-glass)"></i></i>
        <i style="left:92px;bottom:0;width:24px;height:25px"><i style="left:6px;top:0;width:12px;height:12px;border-radius:50%;background:var(--mirror-glass)"></i><i style="left:0;top:13px;width:24px;height:12px;border-radius:10px 10px 0 0;background:var(--mirror-glass)"></i></i>
        <i style="right:8px;bottom:6px;width:14px;height:12px;border-radius:6px 6px 4px 4px;background:var(--mirror-glass)"></i>
        <i style="right:9px;bottom:15px;width:4px;height:6px;border-radius:2px;background:var(--mirror-glass);transform:rotate(-20deg)"></i>
        <i style="right:17px;bottom:15px;width:4px;height:6px;border-radius:2px;background:var(--mirror-glass);transform:rotate(20deg)"></i>
        <i style="left:-20px;top:-10px;width:60px;height:70px;background:rgba(255,255,255,.08);transform:rotate(25deg)"></i>
      </span>
      <span class="cap">2 взрослых · 1 ребёнок · собака</span>
    </button>

    <nav class="sign" aria-label="Готовые поездки из Москвы">
      <div class="in">
        <h1 class="hd" style="margin:0">Готовые поездки из Москвы</h1>
        <button class="srow" aria-label="Тула · Ясная Поляна: 425 километров, туда и обратно, 2 дня, примерно 19 600 рублей. Открыть">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M5 13l7 7 7-7"/></svg>
          <span class="nm">Тула · Ясная Поляна</span>
          <span class="km">425 <small>км</small></span>
          <span class="mt">2 дня · туда и обратно · ≈ 19 600 ₽</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--sign-text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="srow" aria-label="Ярославль: 536 километров, туда и обратно, 2 дня, примерно 19 100 рублей. Открыть">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
          <span class="nm">Ярославль</span>
          <span class="km">536 <small>км</small></span>
          <span class="mt">2 дня · туда и обратно · ≈ 19 100 ₽</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--sign-text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="srow" aria-label="Золотое кольцо: 761 километр по кругу, 3 дня, примерно 37 200 рублей. Открыть">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
          <span class="nm">Золотое кольцо</span>
          <span class="km">761 <small>км</small></span>
          <span class="mt">3 дня · по кругу · ≈ 37 200 ₽</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--sign-text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <div class="ft">≈ ₽ — бензин, ночёвки, еда, билеты и запас&nbsp;10&nbsp;%</div>
      </div>
    </nav>
    <div class="road-strip" aria-hidden="true"></div>
  </div>

  <div class="dash">
    <section class="firstrun" aria-label="Для любой поездки соберём: маршрут по дням, ночёвки по пути, смету в рублях">
      <p class="fr-t">Для любой поездки соберём</p>
      <div class="fr" aria-hidden="true">
        <span><i class="svc"><i><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141416" stroke-width="2.2" stroke-linecap="round"><path d="M4 21L10.5 3M20 21L13.5 3M12 20v-3M12 13v-2M12 7.5V6"/></svg></i></i>маршрут<br>по дням</span>
        <span><i class="svc"><i><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141416" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V7M3 15h18v4M21 15v-2.5A2.5 2.5 0 0 0 18.5 10H11v5"/><circle cx="7" cy="12" r="1.8" fill="#141416"/></svg></i></i>ночёвки<br>по пути</span>
        <span><i class="svc"><i><b>₽</b></i></i>смету<br>в рублях</span>
      </div>
    </section>

    <div class="navi">
      <div class="hd">
        <span>Или свой маршрут</span>
        <button aria-label="Старт: Москва. Изменить">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>
          из Москвы
        </button>
      </div>
      <button class="field" aria-label="Куда едем? Город, адрес или точка на карте">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="t"><b>Куда едем?</b><small>город, адрес или точка на карте</small></span>
      </button>
    </div>

    <div class="bottom">
      <button class="quiet" aria-label="По городу пешком: отдельный режим прогулки. Открыть">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="2" fill="currentColor"/><path d="M9.5 21l2.5-6.5 2.5 2V21M12 14.5l1-5-3.5 1.5L8 14M13 9.5l2.5 3 3 1"/></svg>
        По городу пешком
      </button>
      <p class="demo" style="margin:0">Демо-версия: цены примерные</p>
    </div>
  </div>
</div>
<script src="../shared/scene.js"></script>
</body>
</html>
