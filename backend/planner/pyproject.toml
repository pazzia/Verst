[project]
name = "verst-planner"
version = "0.1.0"
description = "Verst route and cost engine (stdlib only)"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff.lint.per-file-ignores]
# Test fixtures may contain Russian text (backlog rules); Cyrillic letters are not confusables there.
"tests/**" = ["RUF001", "RUF002", "RUF003"]
# Data generators: Russian fixture text and wide hand-made tables.
"tools/gen_*.py" = ["RUF001", "RUF002", "RUF003", "E501", "SIM113", "B007"]
