name: planner
on:
  push:
    branches: [main]
    paths: ["backend/planner/**", "Makefile", ".github/workflows/planner.yml"]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff mypy
      - run: make check
