# ENG-01 (ADR-0017): build a real GraphHopper graph from a Geofabrik Russia extract, start the server and run the
# integration check through verst_planner's GraphHopperRouting adapter (infra/routing/check_routes.py):
# Москва → Ярославль, Москва → Казань (with and without tolls), the Golden Ring loop, and three full plans.
# The raw GraphHopper responses are uploaded as the artifact `routing-recordings` (to replace the synthetic-map
# fixtures in backend/planner/tests/data/graphhopper after review). Manual only: it downloads ~1.7 GB.
name: routing
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Extract: central+volga (Moscow, Golden Ring, Kazan); central (no Kazan: its checks fail); russia (experimental: disk/RAM)"
        type: choice
        options: [central+volga, central, russia]
        default: central+volga
      rebuild:
        description: "Ignore the cached graph and import the latest extract"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: routing
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Pinned GraphHopper (infra/routing/README.md "Pinned versions"); sha256 of the Maven Central jar.
  GH_VERSION: "11.0"
  GH_SHA256: b59c024afe172ec6ec85b6327006c3138ec58c7d0bcd26253d0e42853f613def
  REGION: ${{ inputs.region }}
  # Inside the workspace, not hidden (upload-artifact@v4 skips dot-directories by default), never committed.
  DATA: ${{ github.workspace }}/_routing/data
  OUT: ${{ github.workspace }}/_routing/out

jobs:
  check:
    # Public repository: 4 vCPU, 16 GB RAM, 14 GB SSD (docs.github.com, "GitHub-hosted runners").
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Heap sizes for the region
        # Import: the JVM may take 10 of the 16 GB (ParallelGC, deploy.md); the server only holds the graph
        # (RAM_STORE on the heap) and runs after the import JVM has exited. README.md "Sizing" explains the numbers.
        run: |
          case "$REGION" in
            russia) echo "IMPORT_XMX=12g" >> "$GITHUB_ENV"; echo "SERVER_XMX=10g" >> "$GITHUB_ENV" ;;
            *)      echo "IMPORT_XMX=10g" >> "$GITHUB_ENV"; echo "SERVER_XMX=6g" >> "$GITHUB_ENV" ;;
          esac
          mkdir -p "$DATA" "$OUT"
          free -g; df -h / "$RUNNER_TEMP"; nproc

      - name: Free disk for the whole-Russia extract
        if: inputs.region == 'russia'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: osmium-tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null && osmium --version | head -1

      - name: GraphHopper jar (Maven Central, sha256-checked)
        run: |
          JAR="$DATA/graphhopper-web-$GH_VERSION.jar"
          curl -fsSL --retry 5 -o "$JAR" \
            "https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/$GH_VERSION/graphhopper-web-$GH_VERSION.jar"
          echo "$GH_SHA256  $JAR" | sha256sum -c -
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Extract date (cache key)
        id: osm
        run: |
          case "$REGION" in
            russia) url=https://download.geofabrik.de/russia-latest.osm.pbf ;;
            *) url=https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf ;;
          esac
          modified=$(curl -fsSIL --retry 3 "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="last-modified"{print $2}' | tail -1)
          echo "date=$(date -u -d "$modified" +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "Geofabrik $url Last-Modified: $modified"

      - name: Restore graph
        id: cache
        if: ${{ !inputs.rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DATA }}/graph-cache
            ${{ env.DATA }}/build.json
          key: gh-graph-${{ env.GH_VERSION }}-${{ inputs.region }}-${{ hashFiles('infra/routing/config.yml', 'infra/routing/custom_models/**') }}-${{ steps.osm.outputs.date }}
          # An older extract of the same region and config is fine for this check: it saves the 1.7 GB download
          # and the import on re-runs. `rebuild: true` forces a fresh graph.
          restore-keys: |
            gh-graph-${{ env.GH_VERSION }}-${{ inputs.region }}-${{ hashFiles('infra/routing/config.yml', 'infra/routing/custom_models/**') }}-

      - name: Download extract and import
        id: build
        if: steps.cache.outputs.cache-matched-key == ''
        timeout-minutes: 120
        run: |
          infra/routing/build_graph.sh "$REGION" "$DATA" "$JAR" "$IMPORT_XMX"
          rm -rf "$DATA/osm"   # 1.7+ GB we do not need any more; the server loads graph-cache only
          df -h /

      - name: Save graph
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DATA }}/graph-cache
            ${{ env.DATA }}/build.json
          key: gh-graph-${{ env.GH_VERSION }}-${{ inputs.region }}-${{ hashFiles('infra/routing/config.yml', 'infra/routing/custom_models/**') }}-${{ steps.osm.outputs.date }}

      - name: Start GraphHopper
        run: |
          cat "$DATA/build.json"
          cd infra/routing
          # datareader.file is not read when graph-cache exists; it is set to a path that does not exist on purpose,
          # so a broken cache fails instead of silently importing.
          nohup java "-Xmx$SERVER_XMX" "-Xms$SERVER_XMX" \
            "-Ddw.graphhopper.datareader.file=$DATA/osm/absent.osm.pbf" \
            "-Ddw.graphhopper.graph.location=$DATA/graph-cache" \
            "-Ddw.server.application_connectors[0].bind_host=127.0.0.1" \
            "-Ddw.server.admin_connectors[0].bind_host=127.0.0.1" \
            -jar "$JAR" server config.yml > "$OUT/server.log" 2>&1 &
          echo $! > "$OUT/server.pid"
          for i in $(seq 1 120); do
            if curl -fs http://127.0.0.1:8989/health > /dev/null; then echo "up after ${i}x5 s"; break; fi
            kill -0 "$(cat "$OUT/server.pid")" || { tail -80 "$OUT/server.log"; exit 1; }
            sleep 5
          done
          curl -fs http://127.0.0.1:8989/info | tee "$OUT/info.json" | python3 -c \
            'import json,sys; i=json.load(sys.stdin); print(i["version"], [p["name"] for p in i["profiles"]], i["bbox"])'

      - name: Adapter unit tests
        working-directory: backend/planner
        run: python3 -m unittest tests.unit.test_graphhopper -v 2>&1 | tail -3

      - name: Routes and plans through GraphHopperRouting
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/planner
        run: |
          stamp=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("osmTimestamp","?"))' "$DATA/build.json")
          python3 infra/routing/check_routes.py --url http://127.0.0.1:8989 --out "$OUT" \
            --source "GraphHopper $GH_VERSION, Geofabrik $REGION extract $stamp"

      - name: Server memory (for VM sizing)
        if: always()
        run: |
          pid=$(cat "$OUT/server.pid" 2>/dev/null) || exit 0
          ps -o rss=,vsz= -p "$pid" | awk '{printf "server RSS %.2f GB, VSZ %.2f GB\n", $1/1048576, $2/1048576}' | tee "$OUT/memory.txt"
          du -sh "$DATA/graph-cache" | tee -a "$OUT/memory.txt"
          cp "$DATA/build.json" "$OUT/" 2>/dev/null || true
          cp "$DATA/import.log" "$OUT/" 2>/dev/null || true
          { echo '```'; cat "$OUT/memory.txt" "$OUT/build.json" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          kill "$pid" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-recordings
          path: |
            ${{ env.OUT }}
          retention-days: 30
