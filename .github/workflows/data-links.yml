# CEO 04.11 («куда бы я не ткнул, картинок нет»): 64 of the 101 curated sights of the fixture world have no
# Wikidata link and so no photo. This run only LISTS candidates (Wikidata items with a photo within 10 km of
# each such sight, with the Commons author and licence); a person picks the ids into
# backend/planner/tools/data/curated_wikidata.tsv. Nothing is linked automatically.
#
# Trigger from a working branch (ccr-*): edit backend/planner/tools/data/data-links.request and push; or
# Actions → data-links → Run workflow. ~5 min (one SPARQL query per sight, 2 s apart).
# Result: orphan branch bot/links-<run_number> with curated_candidates.json.
name: data-links
on:
  push:
    branches: ["ccr-*"]
    paths: [backend/planner/tools/data/data-links.request]
  workflow_dispatch:

permissions:
  contents: write   # the orphan bot/links-N branch

concurrency:
  group: data-links
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T: backend/planner/tools/data
      OUT: ${{ github.workspace }}/links-out
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Candidates from Wikidata and Commons
        run: python3 $T/fetch_curated_links.py "$OUT" 2>&1 | tee "$OUT.log"
      - name: Push to bot/links-${{ github.run_number }}
        if: ${{ !cancelled() }}
        run: |
          git config user.name "verst-ci"
          git config user.email "verst-ci@users.noreply.github.com"
          KEEP="$RUNNER_TEMP/keep"; mkdir -p "$KEEP"
          cp -a "$OUT"/. "$KEEP/" 2>/dev/null || true
          cp -f "$OUT.log" "$KEEP/log.txt" 2>/dev/null || true
          git checkout -q --orphan "bot/links-${{ github.run_number }}"
          git read-tree --empty && git clean -fdxq
          cp -a "$KEEP"/. .
          git add -f .
          git commit -m "data: curated sight candidates, run ${{ github.run_id }}" \
                     -m "Generated by .github/workflows/data-links.yml (review list, nothing linked)." || true
          git push origin "bot/links-${{ github.run_number }}"
