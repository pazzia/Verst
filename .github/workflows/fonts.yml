# One-off: fetch the OFL fonts of design v5 into the repo (DES-100, docs/architecture-android-mvp.md §10.2).
# Output is pushed to branch bot/fonts-<run_number> (also when the glyph check fails, so the lock can be read
# from the sandbox); the Designer verifies android/fonts.lock, the Manager merges. design/fonts-probe is never merged.
name: fonts
on:
  push:
    branches: [fonts-request]   # trigger from the sandbox: git push origin HEAD:fonts-request (dispatch API may be blocked)
  workflow_dispatch:
    inputs:
      ref:
        description: "google/fonts ref to pin (branch, tag or commit); the resolved commit is recorded"
        type: string
        default: main

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fonttools==4.55.0"
      - name: Fetch fonts and check glyphs
        env:
          FONTS_REF: ${{ inputs.ref || 'main' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/fetch_fonts.py
      - name: Push to bot/fonts-${{ github.run_number }}
        if: ${{ !cancelled() }}
        run: |
          git config user.name "verst-ci"
          git config user.email "verst-ci@users.noreply.github.com"
          git checkout -b "bot/fonts-${{ github.run_number }}"
          git add android/core-ui/src/main/res/font android/core-ui/src/main/assets/licenses android/fonts.lock
          if [ -d design/fonts-probe ]; then git add design/fonts-probe; fi
          git commit -m "fonts: OFL fonts, google/fonts $(python3 -c 'import json;print(json.load(open("android/fonts.lock"))["googleFontsCommit"][:12])') + upstream npm where needed" \
                     -m "Generated by .github/workflows/fonts.yml run ${{ github.run_id }}; see android/fonts.lock."
          git push origin "bot/fonts-${{ github.run_number }}"
